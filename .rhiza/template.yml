repository: "jebel-quant/rhiza"
ref: "v1.7.1"

profiles:
    - github-project

templates:
    - devcontainer
    # Ships .github/workflows/rhiza_paper.yml, which compiles docs/paper/*.tex into a PDF
    # published as a workflow artifact (and, via the book, as a docs-site asset). The layout
    # it expects is documented upstream: https://jebel-quant.github.io/rhiza/development/PAPER/
    - github-paper
    - legal

# Paths matched against the *destination* (where the file lands here), not the
# clone-relative bundle path — `normalise_excludes` only tidies separators.
exclude:
    # SECURITY.md makes factual claims about THIS repo's security posture (which scanners,
    # which release protections). Only the repo knows which are true, so the file is owned
    # here rather than template-managed.
    - SECURITY.md
    # Contributor-facing GitHub meta doc: this repo's own, not the template's generic version.
    - .github/CONFIG.md
