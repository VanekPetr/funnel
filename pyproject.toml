[project]
name = 'ifunnel'
version = "0.0.0"
description = "Backend for the investment-funnel"
# Please add authors and correct the email...
authors = [{name='Thomas Schmelzer', email= 'thomas.schmelzer@gmail.com'},
           {name="Petr Vanek", email="abc@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "clarabel>=0.10.0",
    "cvxpy-base>=1.6.1",
    "python-dotenv>=1.1.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.9",
    "mosek>=11.1.11",
    "networkx>=3.4.2",
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "plotly>=6.7.0",
    "pyarrow>=22.0.0",
    "pydantic-settings>=2.14.1",
    "pydantic>=2.13.4",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.34.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.2",
    "yfinance>=0.2.60",
]

[project.urls]
repository = "https://github.com/tschm/funnel"

[dependency-groups]
dev = [
    "marimo>=0.23.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ifunnel"]

[tool.hatch.build]
include = [
    "LICENSE",    # Ensure the LICENSE file is included in your package
    "README.md",
    "src/ifunnel"
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
# Disable strict checks that are too noisy for this codebase
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
warn_return_any = false
disable_error_code = [
    "type-arg",
    "var-annotated",
    "union-attr",
    "misc",
    "return",
    "return-value",
    "assignment",
    "no-any-return",
    "no-untyped-def",
    "no-untyped-call",
    "import-untyped",
]

[tool.deptry.per_rule_ignores]
DEP002 = ["clarabel","pyarrow","ecos","mosek","cvxpy-base","pydantic"]

[tool.deptry.package_module_name_map]
clarabel = ["clarabel"]
cvxpy-base = ["cvxpy"]  # not strictly needed, but safe
loguru = ["loguru"]
marimo = ["marimo"]
matplotlib = ["matplotlib"]
mosek = ["mosek"]
networkx = ["networkx"]
numpy = ["numpy"]
pandas = ["pandas"]
plotly = ["plotly"]
pyarrow = ["pyarrow"]
pydantic = ["pydantic"]
pydantic-settings = ["pydantic_settings"]
python-dateutil = ["dateutil"]
python-dotenv = ["dotenv"]
requests = ["requests"]
scikit-learn = ["sklearn"]
scipy = ["scipy"]
yfinance = ["yfinance"]
