[project]
name = 'ifunnel'
# Derived from the git tag by hatch-vcs (see [tool.hatch.version]) rather than written
# here, so the tag is the single source of truth and no commit can disagree with it.
dynamic = ["version"]
description = "Backend for the investment-funnel"
license = "MIT"
# Please add authors and correct the email...
authors = [{name='Thomas Schmelzer', email= 'thomas.schmelzer@gmail.com'},
           {name="Petr Vanek", email="abc@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
# Source of truth for the CI Python matrix: rhiza's ci workflow reads these
# classifiers to decide which versions `test` and `typecheck` run against.
# Adding or removing one changes CI coverage, so only list versions that pass.
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "clarabel>=0.10.0",
    "cvxpy-base>=1.9.2",
    "python-dotenv>=1.1.1",
    "loguru>=0.7.3",
    "matplotlib>=3.11.1",
    "mosek>=11.2.2",
    "networkx>=3.4.2",
    "numpy>=2.4.6",
    "pandas>=2.3.0",
    "plotly>=6.9.0",
    "pyarrow>=22.0.0",
    "pydantic-settings>=2.15.0",
    "pydantic>=2.13.4",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.15.2",
    "yfinance>=1.6.0",
]

[project.urls]
Homepage = "https://github.com/VanekPetr/funnel"
Repository = "https://github.com/VanekPetr/funnel"

[dependency-groups]
dev = [
    "marimo>=0.23.16",
]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-mock>=3",
]
lint = [
    "ruff>=0.16.3",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ifunnel"]

[tool.hatch.version]
# Resolves [project].dynamic = ["version"] from `git describe`. Tags are vX.Y.Z and
# hatch-vcs strips the leading "v" by default, so v0.1.0 builds 0.1.0; a commit off the
# tag builds a PEP 440 dev version (0.1.1.dev248+g<sha>). Note the derived name is
# ifunnel, from [project].name -- the repo is funnel, the distribution is not.
#
# This makes the build history-dependent: a shallow clone that cannot see the tag does
# not fail, it silently builds 0.1.dev1+g<sha>. Every checkout in rhiza_release.yml uses
# fetch-depth: 0, and its "Verify built distribution matches the tag" step parses the
# filename in dist/ and fails the release unless it carries the tag -- nothing earlier
# can catch a wrong derived version.
#
# This required rhiza v1.8.0 (merged as #254). Under v1.7.1 the release workflow ran
# `uv version --short` unconditionally, which exits non-zero on a dynamic version ("We
# cannot get or set dynamic project versions"); v1.8.0 detects the dynamic case and
# checks the built distribution against the tag instead.
source = "vcs"

[tool.hatch.build]
include = [
    "LICENSE",    # Ensure the LICENSE file is included in your package
    "README.md",
    "src/ifunnel"
]

[tool.bumpversion]
# No current_version and no [[tool.bumpversion.files]] entry -- there never was one, and
# now there is nothing to write either: [project].version is dynamic (see
# [tool.hatch.version]), so the tag alone decides what gets built and a release is a tag,
# not an edit. The table stays because bump-my-version still has to *discover* a config;
# from a path it never reads it falls back to `git describe`.
allow_dirty = false
# /rhiza:release commits and tags itself so the changelog lands in the bump
# commit; a bare `bump-my-version bump` would add a second commit and a
# duplicate tag.
commit = false
tag = false

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
# Disable strict checks that are too noisy for this codebase
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
warn_return_any = false
disable_error_code = [
    "type-arg",
    "var-annotated",
    "union-attr",
    "misc",
    "return",
    "return-value",
    "assignment",
    "no-any-return",
    "no-untyped-def",
    "no-untyped-call",
    "import-untyped",
]

# cvxpy re-exports helpers (norm, sum, ...) dynamically, so mypy cannot see them
# as module attributes. Treat the package as untyped rather than sprinkling
# per-line `# type: ignore[attr-defined]` (which ty then reports as unused).
[[tool.mypy.overrides]]
module = ["cvxpy", "cvxpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.rhiza-task]
# Settings recovered from the make layer that rhiza v1.4.0 retired. Only entries whose
# value differs from rhiza-task's own default are listed: naming a setting that already
# matches is the line someone later edits and drifts.
#
# typechecker: `.rhiza/make.d/python.mk` had `TYPECHECKER ?= both`; the CLI defaults to
# `ty` alone. Without this line the `typecheck` gate silently stops running mypy --strict,
# and the [tool.mypy] config and the cvxpy override above become dead weight. It also gets
# *stricter* than the make layer was: the old shell `case` let mypy's exit status win, so a
# `ty` failure could pass.
typechecker = "both"

# pytest_rhiza: `.rhiza/make.d/quality.mk` pinned `RHIZA_CHECKS_VERSION ?= 0.2.1`, which it
# installed as `pytest-rhiza==0.2.1`. The CLI default is *older* — `pytest-rhiza @
# git+https://github.com/Jebel-Quant/pytest-rhiza@v0.2.0` — so leaving this unset would
# downgrade the rhiza-check assertions rather than preserve them.
#
# Raised 0.2.1 -> 0.6.0 when [project].version became dynamic. Every release up to and
# including 0.5.0 reads `project["version"]` unconditionally, so a derived version fails
# test_version_follows_semver (empty string against the semver regex) and the git-tag
# comparison (InvalidVersion on ""). 0.6.0 is the first release that asks whether the
# version is dynamic and skips those two assertions; there is no older version to pin.
pytest_rhiza = "pytest-rhiza==0.6.0"

# Not set, on purpose — each of these matched rhiza-task 0.3.1's default exactly, so
# naming it would add a maintenance surface without changing behaviour:
#   source_folder ("src") and marimo_folder ("docs/notebooks") — from `.rhiza/.env`.
#   coverage_fail_under (90), tests_folder ("tests"), uv_sync_args
#     ("--all-extras --all-groups"), license_fail_on ("GPL;LGPL;AGPL") — from `python.mk`.
#   zensical_version (">=0.0.36"), book_output ("_book") — from `book.mk`.
#   rhiza_checks — `python.mk`, `quality.mk` and `test.mk` accumulated five modules with
#     `+=`; `rhiza_checks_for(("python",))` derives exactly the same five from the layer
#     set, so the accumulator is reproduced, not lost.
#   mkdocs_extra_packages — the old `Makefile` set `--with 'mkdocstrings[python]'`, which
#     is now the default. Restating it would be worse than omitting it: naming this setting
#     *replaces* the default list, so the next person adding a package would silently drop
#     mkdocstrings from the book build.
#   license_ignore_packages — `marimo.mk` appended `docutils`; rhiza-task appends it itself
#     whenever the marimo tasks are registered.
#   deptry_ignore — `marimo.mk` appended `--ignore DEP004`; rhiza-task derives that too,
#     when the marimo tasks are registered and the marimo folder exists.
#   ci_os_matrix — `.rhiza/.env` deliberately left `RHIZA_CI_OS_MATRIX` unset so that
#     `rhiza_ci.yml` could pick the matrix per caller. Pinning it here would defeat that.
#
# Cosmetic make variables with no equivalent and nothing to preserve: PROJECT_NAME_EXTRA
# and LOG_LEVEL (`custom-env.mk`), VENV, FORGE_TYPE and the derived *_FOLDERS lists.

[tool.deptry.per_rule_ignores]
DEP002 = ["clarabel","pyarrow","ecos","mosek","cvxpy-base","pydantic"]

[tool.deptry.package_module_name_map]
clarabel = ["clarabel"]
cvxpy-base = ["cvxpy"]  # not strictly needed, but safe
loguru = ["loguru"]
marimo = ["marimo"]
matplotlib = ["matplotlib"]
mosek = ["mosek"]
networkx = ["networkx"]
numpy = ["numpy"]
pandas = ["pandas"]
plotly = ["plotly"]
pyarrow = ["pyarrow"]
pydantic = ["pydantic"]
pydantic-settings = ["pydantic_settings"]
python-dateutil = ["dateutil"]
python-dotenv = ["dotenv"]
requests = ["requests"]
scikit-learn = ["sklearn"]
scipy = ["scipy"]
yfinance = ["yfinance"]
